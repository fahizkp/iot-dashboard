# Production Docker Compose Configuration
# Replace placeholders before deploying:
#   - <your-username>: Your GitHub username or organization
#   - <your-app>: Your application name
#   - <your-domain>: Your domain name (e.g., example.com)

services:
  iot-dashboard-api:
    image: ghcr.io/fahizkp/iot-dashboard-api:latest
    container_name: iot-dashboard-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGIN=https://iot.wisdommlpe.site
    networks:
      - infra
      - iot-dashboard-internal

  iot-dashboard:
    image: ghcr.io/fahizkp/iot-dashboard:latest
    container_name: iot-dashboard
    restart: unless-stopped
    depends_on:
      - iot-dashboard-api
    networks:
      - web
      - iot-dashboard-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iot-dashboard.rule=Host(`iot.wisdommlpe.site`)"
      - "traefik.http.routers.iot-dashboard.entrypoints=websecure"
      - "traefik.http.routers.iot-dashboard.tls=true"
      - "traefik.http.routers.iot-dashboard.tls.certresolver=myresolver"
      - "traefik.http.services.iot-dashboard.loadbalancer.server.port=80"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.iot-dashboard-http.rule=Host(`iot.wisdommlpe.site`)"
      - "traefik.http.routers.iot-dashboard-http.entrypoints=web"
      - "traefik.http.routers.iot-dashboard-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

networks:
  web:
    external: true
  infra:
    external: true
  iot-dashboard-internal:
