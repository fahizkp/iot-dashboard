# Production Docker Compose Configuration
# Replace placeholders before deploying:
#   - <your-username>: Your GitHub username or organization
#   - <your-app>: Your application name
#   - <your-domain>: Your domain name (e.g., example.com)

services:
  # Backend API server
  sample-app-api:
    image: ghcr.io/<your-username>/<your-app>-api:latest
    container_name: sample-app-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGIN=https://<your-domain>
    networks:
      - infra
      - sample-app-internal

  # Frontend + nginx
  sample-app:
    image: ghcr.io/<your-username>/<your-app>:latest
    container_name: sample-app
    restart: unless-stopped
    depends_on:
      - sample-app-api
    networks:
      - web
      - sample-app-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sample-app.rule=Host(`<your-domain>`)"
      - "traefik.http.routers.sample-app.entrypoints=websecure"
      - "traefik.http.routers.sample-app.tls=true"
      - "traefik.http.routers.sample-app.tls.certresolver=myresolver"
      - "traefik.http.services.sample-app.loadbalancer.server.port=80"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.sample-app-http.rule=Host(`<your-domain>`)"
      - "traefik.http.routers.sample-app-http.entrypoints=web"
      - "traefik.http.routers.sample-app-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

networks:
  web:
    external: true
  infra:
    external: true
  sample-app-internal:
